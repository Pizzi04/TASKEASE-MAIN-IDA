mo","Una piattaforma che mette in contatto chi cerca aiuto con chi lavora nella zona di Forl\xEC-Cesena. Non siamo parte dell'accordo tra cliente e chi lavora e non incassiamo il prezzo del lavoro."],["Versione dei documenti",li+". Le modifiche ai Termini vengono annunciate almeno 15 giorni prima; quelle alle regole dell'IDA 30 giorni prima."]]},termini:{t:"Termini d'uso",s:[["Cosa fa TaskEase","Ti aiuta a trovare chi pu\xF2 fare un lavoro e a prenotarlo. L'accordo su lavoro, tempi e prezzo \xE8 tra te e chi lavora: TaskEase non lo esegue, non lo dirige e non \xE8 il datore di lavoro di nessuno."],["Chi pu\xF2 usarla","Persone maggiorenni che danno dati veri. Un profilo per persona. Sei responsabile di quello che scrivi."],["Professionisti e privati","Ogni profilo dichiara se lavora con Partita IVA o da privato in prestazione occasionale, e lo mostriamo. Con un privato non si applicano i diritti dei consumatori previsti dal diritto UE (per esempio recesso e garanzie del Codice del Consumo)."],["Impianti","Lavori su impianti elettrici, gas, idrico-sanitari e di riscaldamento li possono fare solo imprese abilitate (DM 37/2008). Chi sceglie queste categorie lo dichiara e ne risponde."],["Prezzi e pagamenti","La tariffa \xE8 decisa da chi lavora e mostrata prima della prenotazione. Paghi direttamente a fine lavoro, come vi accordate. TaskEase non incassa n\xE9 trattiene niente sul lavoro. L'abbonamento Pro per chi lavora \xE8 facoltativo e non cambia l'ordine dei risultati n\xE9 l'IDA."],["Giudizi e IDA","Pu\xF2 giudicare solo chi ha prenotato tramite TaskEase. Le regole di calcolo sono pubbliche nella pagina \u201CCome verifichiamo i giudizi\u201D. Chi riceve un giudizio potr\xE0 rispondere una volta (funzione attiva al lancio)."],["Contenuti vietati e segnalazioni","Vietati contenuti illegali, offensivi, falsi o con dati personali di altri. Chiunque pu\xF2 segnalarli con il tasto \u201CSegnala\u201D. Decidiamo in modo motivato e lo comunichiamo per SMS o email a chi ha segnalato e a chi ha pubblicato. Entrambi possono contestare la decisione, gratis, rispondendo a quel messaggio entro 6 mesi: la riesamina una persona."],["Sospensione e chiusura","Possiamo sospendere un profilo per violazioni gravi o ripetute, spiegando il motivo. Puoi cancellare il tuo profilo quando vuoi da Profilo."],["Responsabilit\xE0","Chi esegue il lavoro ne risponde. TaskEase risponde del proprio servizio di messa in contatto, nei limiti di legge."],["Legge e foro","Legge italiana. Per i consumatori \xE8 competente il giudice del luogo in cui risiedono."]]},privacy:{t:"Informativa privacy",s:[["Titolare del trattamento","[Nome e cognome o ragione sociale], [indirizzo], Forl\xEC \xB7 [email di contatto]."],["Quali dati","Chi cerca aiuto: nome, cellulare, zona; l'indirizzo solo quando prenoti. Chi lavora: in pi\xF9 nome e cognome, foto, competenze, tariffa, zone, data di nascita, residenza, codice fiscale, eventuale Partita IVA e le dichiarazioni su abilitazione e assicurazione. Per tutti: prenotazioni, giudizi, messaggi, annunci in bacheca (con eventuale foto), preferiti, persone bloccate, segnalazioni (con nome ed email di chi segnala) e la data in cui hai accettato i Termini."],["Perch\xE9 e su quale base","Per far funzionare il servizio che chiedi (contratto). Per obblighi di legge: comunicazione fiscale delle piattaforme (DAC7) e gestione delle segnalazioni previste dal Regolamento UE sui servizi digitali. Per la sicurezza degli utenti, compresa la verifica dell'identit\xE0 di chi lavora (legittimo interesse). Niente pubblicit\xE0 e niente vendita di dati."],["Chi li vede","Pubblici, visibili a chiunque usi l'app: il profilo di chi lavora (nome e cognome, foto, competenze, tariffa, zone, IDA, se \xE8 privato o con P.IVA), i giudizi con nome e iniziale di chi li ha scritti, gli annunci in bacheca con nome e zona. Riservati: cellulare e indirizzo, solo a chi accetta il lavoro; dati fiscali, solo a noi e, quando dovuto, all'Agenzia delle Entrate. Fornitori tecnici (hosting e invio SMS) li trattano per nostro conto, nell'Unione europea."],["Per quanto tempo","Finch\xE9 il profilo \xE8 attivo. Messaggi e segnalazioni: 12 mesi dalla chiusura. Se un profilo resta inattivo 24 mesi ti avvisiamo e poi lo cancelliamo. Dopo la cancellazione togliamo i dati entro 30 giorni, tranne quelli che la legge ci obbliga a conservare (dati fiscali); i giudizi che hai lasciato restano senza il tuo nome."],["Documenti d'identit\xE0","La verifica la facciamo guardando il documento di persona o in videochiamata. Non conserviamo copie: salviamo solo che la verifica \xE8 avvenuta e quando."],["I tuoi diritti","Accesso, correzione, cancellazione, portabilit\xE0 (\u201CScarica i miei dati\u201D in Profilo), opposizione e limitazione. Puoi fare reclamo al Garante per la protezione dei dati personali."],["Cookie e caratteri","Solo cookie tecnici necessari al funzionamento. Nessun cookie di profilazione o di statistica. In questa anteprima i caratteri tipografici arrivano da Google Fonts; nell'app vera li ospitiamo sui nostri server."]]},ranking:{t:"Come ordiniamo i risultati",s:[["L'ordine di partenza","Dalla persona pi\xF9 vicina a te. La distanza si calcola dalla tua zona, non dal tuo indirizzo. Nessuno paga per comparire prima e l'abbonamento Pro non cambia l'ordine."],["In home","Vedi le tre persone disponibili pi\xF9 vicine. Chi ha spento \u201CDisponibile\u201D lo trovi comunque in Cerca."],["Gli ordinamenti che scegli tu","Puoi ordinare per prezzo o per IDA pi\xF9 alto. Ordinando per IDA, chi \xE8 nuovo e non ha ancora un IDA va in fondo, dopo gli altri. Le categorie filtrano per competenze e descrizione dichiarate."],["Cosa non usiamo","Non premiamo chi accetta pi\xF9 lavori o risponde pi\xF9 spesso, e non nascondiamo chi rifiuta."]]},giudizi:{t:"Come verifichiamo i giudizi",s:[["Chi pu\xF2 giudicare","Solo chi ha prenotato quel lavoro tramite TaskEase: un giudizio per prenotazione."],["Come si calcola","Cinque domande da 1 a 5: puntualit\xE0 20%, qualit\xE0 30%, parola mantenuta 20%, pulizia 15%, comunicazione 15%. Ogni giudizio vale da 20 a 100. L'IDA compare dopo "+oe+" lavori: gli ultimi 12 mesi contano per intero, da 12 a 24 mesi a met\xE0, oltre non contano."],["Cosa non facciamo","Non paghiamo giudizi, non li scriviamo noi e non togliamo quelli negativi. Rimuoviamo solo testi illegali, offensivi o con dati personali, spiegando il motivo."],["Diritto di replica","Al lancio chi riceve un giudizio potr\xE0 rispondere una volta, sotto al giudizio. Nell'anteprima la risposta non \xE8 ancora attiva."]]},sicurezza:{t:"Consigli di sicurezza",s:[["Prima del lavoro","Concorda per iscritto in chat cosa va fatto, la tariffa e le ore stimate. Diffida di chi chiede soldi in anticipo."],["Durante","Se puoi, non restare solo in casa con persone che non conosci la prima volta. Per i lavori su impianti chiedi la dichiarazione di conformit\xE0."],["Dopo","Paga solo le ore reali, chiedi la ricevuta o la fattura se dovuta, e lascia il giudizio: aiuta chi verr\xE0 dopo."],["Se qualcosa va storto","Usa \u201CSegnala un problema\u201D: leggiamo ogni segnalazione. In caso di pericolo chiama il 112."]]}};function Zt({nav:i,doc:o="info"}){let t=bi[o]||bi.info;return React.createElement("div",{style:{flex:1,minHeight:0,background:e.paper,overflow:"auto"}},React.createElement(K,{nav:i,to:"account",title:t.t}),React.createElement("div",{style:{padding:"4px 22px 28px"}},React.createElement("div",{className:"esempio-top",style:{marginBottom:16}},React.createElement("span",{className:"ticker-tag"},"BOZZA"),React.createElement("span",null,li,". Testo per l'anteprima, da far revisionare a un legale prima del lancio.")),t.s.map(([r,s])=>React.createElement("section",{key:r,style:{marginBottom:18}},React.createElement("h2",{style:{fontFamily:"'Fraunces',serif",fontSize:16,fontWeight:600,color:e.ink,margin:"0 0 4px"}},r),React.createElement("p",{style:{fontSize:13.5,color:e.ink2,lineHeight:1.6,margin:0}},s))),o==="info"&&React.c .row:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(28,27,24,.06); border-color: ${e.faint}; }

/* ---------- Dentro l'app ---------- */
.home { flex: 1; min-height: 0; overflow-y: auto; background: ${e.paper}; }
.home-hero { background: radial-gradient(130% 90% at 80% 0%, #1F4E46 0%, ${e.pineDeep} 60%, #0F2420 100%); color: ${e.paper}; padding: 18px 22px 46px; border-radius: 0 0 30px 30px; }

.dock-wrap { padding: 8px 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: ${e.paper}; flex-shrink: 0; }

@keyframes draw { to { stroke-dashoffset: 0; } }
