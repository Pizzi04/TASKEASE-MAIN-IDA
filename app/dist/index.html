lefono/WhatsApp: [numero]. \xC8 anche il punto di contatto per utenti e autorit\xE0 previsto dal Regolamento UE sui servizi digitali (DSA). Rispondiamo in italiano."],["Cosa siamo","Una piattaforma che mette in contatto chi cerca aiuto con chi lavora nella zona di Forl\xEC-Cesena. Non siamo parte dell'accordo tra cliente e chi lavora e non incassiamo il prezzo del lavoro."],["Versione dei documenti",li+". Le modifiche ai Termini vengono annunciate almeno 15 giorni prima; quelle alle regole dell'IDA 30 giorni prima."]]},termini:{t:"Termini d'uso",s:[["Cosa fa TaskEase","Ti aiuta a trovare chi pu\xF2 fare un lavoro e a prenotarlo. L'accordo su lavoro, tempi e prezzo \xE8 tra te e chi lavora: TaskEase non lo esegue, non lo dirige e non \xE8 il datore di lavoro di nessuno."],["Chi pu\xF2 usarla","Persone maggiorenni che danno dati veri. Un profilo per persona. Sei responsabile di quello che scrivi."],["Professionisti e privati","Ogni profilo dichiara se lavora con Partita IVA o da privato in prestazione occasionale, e lo mostriamo. Con un privato non si applicano i diritti dei consumatori previsti dal diritto UE (per esempio recesso e garanzie del Codice del Consumo)."],["Impianti","Lavori su impianti elettrici, gas, idrico-sanitari e di riscaldamento li possono fare solo imprese abilitate (DM 37/2008). Chi sceglie queste categorie lo dichiara e ne risponde."],["Prezzi e pagamenti","La tariffa \xE8 decisa da chi lavora e mostrata prima della prenotazione. Paghi direttamente a fine lavoro, come vi accordate. TaskEase non incassa n\xE9 trattiene niente sul lavoro. L'abbonamento Pro per chi lavora \xE8 facoltativo e non cambia l'ordine dei risultati n\xE9 l'IDA."],["Giudizi e IDA","Pu\xF2 giudicare solo chi ha prenotato tramite TaskEase. Le regole di calcolo sono pubbliche nella pagina \u201CCome verifichiamo i giudizi\u201D. Chi riceve un giudizio potr\xE0 rispondere una volta (funzione attiva al lancio)."],["Contenuti vietati e segnalazioni","Vietati contenuti illegali, offensivi, falsi o con dati personali di altri. Chiunque pu\xF2 segnalarli con il tasto \u201CSegnala\u201D. Decidiamo in modo motivato e lo comunichiamo per SMS o email a chi ha segnalato e a chi ha pubblicato. Entrambi possono contestare la decisione, gratis, rispondendo a quel messaggio entro 6 mesi: la riesamina una persona."],["Sospensione e chiusura","Possiamo sospendere un profilo per violazioni gravi o ripetute, spiegando il motivo. Puoi cancellare il tuo profilo quando vuoi da Profilo."],["Responsabilit\xE0","Chi esegue il lavoro ne risponde. TaskEase risponde del proprio servizio di messa in contatto, nei limiti di legge."],["Legge e foro","Legge italiana. Per i consumatori \xE8 competente il giudice del luogo in cui risiedono."]]},privacy:{t:"Informativa privacy",s:[["Titolare del trattamento","[Nome e cognome o ragione sociale], [indirizzo], Forl\xEC \xB7 [email di contatto]."],["Quali dati","Chi cerca aiuto: nome, cellulare, zona; l'indirizzo solo quando prenoti. Chi lavora: in pi\xF9 nome e cognome, foto, competenze, tariffa, zone, data di nascita, residenza, codice fiscale, eventuale Partita IVA e le dichiarazioni su abilitazione e assicurazione. Per tutti: prenotazioni, giudizi, messaggi, annunci in bacheca (con eventuale foto), preferiti, persone bloccate, segnalazioni (con nome ed email di chi segnala) e la data in cui hai accettato i Termini."],["Perch\xE9 e su quale base","Per far funzionare il servizio che chiedi (contratto). Per obblighi di legge: comunicazione fiscale delle piattaforme (DAC7) e gestione delle segnalazioni previste dal Regolamento UE sui servizi digitali. Per la sicurezza degli utenti, compresa la verifica dell'identit\xE0 di chi lavora (legittimo interesse). Niente pubblicit\xE0 e niente vendita di dati."],["Chi li vede","Pubblici, visibili a chiunque usi l'app: il profilo di chi lavora (nome e cognome, foto, competenze, tariffa, zone, IDA, se \xE8 privato o con P.IVA), i giudizi con nome e iniziale di chi li ha scritti, gli annunci in bacheca con nome e zona. Riservati: cellulare e indirizzo, solo a chi accetta il lavoro; dati fiscali, solo a noi e, quando dovuto, all'Agenzia delle Entrate. Fornitori tecnici (hosting e invio SMS) li trattano per nostro conto, nell'Unione europea."],["Per quanto tempo","Finch\xE9 il profilo \xE8 attivo. Messaggi e segnalazioni: 12 mesi dalla chiusura. Se un profilo resta inattivo 24 mesi ti avvisiamo e poi lo cancelliamo. Dopo la cancellazione togliamo i dati entro 30 giorni, tranne quelli che la legge ci obbliga a conservare (dati fiscali); i giudizi che hai lasciato restano senza il tuo nome."],["Documenti d'identit\xE0","La verifica la facciamo guardando il documento di persona o in videochiamata. Non conserviamo copie: salviamo solo che la verifica \xE8 avvenuta e quando."],["I tuoi diritti","Accesso, correzione, cancellazione, portabilit\xE0 (\u201CScarica i miei dati\u201D in Profilo), opposizione e limitazione. Puoi fare reclamo al Garante per la protezione dei dati personali."],["Cookie e caratteri","Solo cookie tecnici necessari al funzionamento. Nessun cookie di profilazione o di statistica. In questa anteprima i caratteri tipografici arrivano da Google Fonts; nell'app vera li ospitiamo sui nostri server."]]},ranking:{t:"Come ordiniamo i risultati",s:[["L'ordine di partenza","Dalla persona pi\xF9 vicina a te. La distanza si calcola dalla tua zona, non dal tuo indirizzo. Nessuno paga per comparire prima e l'abbonamento Pro non cambia l'ordine."],["In home","Vedi le tre persone disponibili pi\xF9 vicine. Chi ha spento \u201CDisponibile\u201D lo trovi comunque in Cerca."],["Gli ordinamenti che scegli tu","Puoi ordinare per prezzo o per IDA pi\xF9 alto. Ordinando per IDA, chi \xE8 nuovo e non ha ancora un IDA va in fondo, dopo gli altri. Le categorie filtrano per competenze e descrizione dichiarate."],["Cosa non usiamo","Non premiamo chi accetta pi\xF9 lavori o risponde pi\xF9 spesso, e non nascondiamo chi rifiuta."]]},giudizi:{t:"Come verifichiamo i giudizi",s:[["Chi pu\xF2 giudicare","Solo chi ha prenotato quel lavoro tramite TaskEase: un giudizio per prenotazione."],["Come si calcola","Cinque domande da 1 a 5: puntualit\xE0 20%, qualit\xE0 30%, parola mantenuta 20%, pulizia 15%, comunicazione 15%. Ogni giudizio vale da 20 a 100. L'IDA compare dopo "+oe+" lavori: gli ultimi 12 mesi contano per intero, da 12 a 24 mesi a met\xE0, oltre non contano."],["Cosa non facciamo","Non paghiamo giudizi, non li scriviamo noi e non togliamo quelli negativi. Rimuoviamo solo testi illegali, offensivi o con dati personali, spiegando il motivo."],["Diritto di replica","Al lancio chi riceve un giudizio potr\xE0 rispondere una volta, sotto al giudizio. Nell'anteprima la risposta non \xE8 ancora attiva."]]},sicurezza:{t:"Consigli di sicurezza",s:[["Prima del lavoro","Concorda per iscritto in chat cosa va fatto, la tariffa e le ore stimate. Diffida di chi chiede soldi in anticipo."],["Durante","Se puoi, non restare solo in casa con persone che non conosci la prima volta. Per i lavori su impianti chiedi la dichiarazione di conformit\xE0."],["Dopo","Paga solo le ore reali, chiedi la ricevuta o la fattura se dovuta, e lascia il giudizio: aiuta chi verr\xE0 dopo."],["Se qualcosa va storto","Usa \u201CSegnala un problema\u201D: leggiamo ogni segnalazione. In caso di pericolo chiama il 112."]]}};function eo({nav:i,doc:t="info"}){let o=bi[t]||bi.info;return React.createElement("div",{style:{flex:1,minHeight:0,background:e.paper,overflow:"auto"}},React.createElement(X,{nav:i,to:"account",title:o.t}),React.createElement("div",{style:{padding:"4px 22px 28px"}},React.createElement("div",{className:"esempio-top",style:{marginBottom:16}},React.createElement("span",{className:"ticker-tag"},"BOZZA"),React.createElement("span",null,li,". Testo per l'anteprima, da far revisionare a un legale prima del lancio.")),o.s.map(([r,n])=>React.createElement("section",{key:r,style:{marginBottom:18}},React.createElement("h2",{style:{fontFamily:"'Hanken Gro *, *::before, *::after { box-sizing: border-box; }
body, body * { margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body { background: #E4DFD4; }
@media (max-width: 520px) { body { background: ${e.paper}; } }
::-webkit-scrollbar { width: 0; }
input::placeholder, textarea::placeholder { color: ${e.stone}; }
.campo { display: flex; align-items: center; gap: 10px; background: ${e.card}; border: 1.5px solid ${e.faint}; border-radius: 14px; padding: 0 14px; min-height: 48px; }
.campo:focus-within { border-color: ${e.accent}; box-shadow: 0 0 0 3px rgba(127,209,188,.22); }
.campo input { outline: none !important; }
input:focus-visible, textarea:focus-visible { outline: 2.5px solid ${e.accent} !important; outline-offset: 1px; }
.row:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.25); border-color: ${e.faint}; }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(.99); }
.cat:hover > div:first-child { border-color: ${e.accent}; background: ${e.pineSoft}; transform: translateY(-2px); }
.opt:hover { border-color: ${e.accent}; background: ${e.pineSoft}; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.dot:hover { filter: brightness(1.1); transform: translate(-50%,-50%) scale(1.2); }
.tap:active { transform: scale(.92); opacity: .7; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }
@keyframes rg { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes stamp { 0% { transform: scale(0) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.12) rotate(4deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }

.ent { position: relative; height: 100%; background: radial-gradient(120% 70% at 50% 18%, #1F4E46 0%, ${e.pineDeep} 55%, #0F2420 100%); color: ${e.cream}; overflow: hidden; }

.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }

/* ---------- Dentro l'app \u2014 "notte e ocra": riquadri arrotondati, numeri grandi, accenti ocra ---------- */
.home { flex: 1; min-height: 0; overflow-y: auto; background: ${e.paper}; }
.home-hero { padding: 18px 20px 0; color: ${e.ink}; }
.home-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.home-sub { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: ${e.stone}; margin-top: 2px; }
.kicker { font-size: 13px; font-weight: 600; color: ${e.stone}; }
.glass-ic { position: relative; width: 44px; height: 44px; border-radius: 14px; background: ${e.card}; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: ${e.ink}; }
.glass-dot { position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: ${e.ochreLight}; box-shadow: 0 0 0 2px ${e.card}; }
.home-h { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: clamp(28px, 8.6vw, 34px); line-height: 1.04; letter-spacing: -1.3px; margin: 6px 0 20px; text-wrap: balance; }
.home-h em { font-style: normal; background: linear-gradient(90deg, ${e.ochreLight}, #F0CF95); -webkit-background-clip: text; background-clip: text; color: transparent; }
.home-search, .home-cta { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 16px; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; cursor: pointer; text-align: left; }
.home-search { background: ${e.card}; border: 1px solid ${e.line}; color: ${e.stone}; }

.home-cta { background: ${e.ochreBtn}; border: 0; color: #fff; font-weight: 700; }
.home-cta span { flex: 1; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 0; scrollbar-width: none; }

.cat2 { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 12px; background: ${e.card}; border: 1px solid ${e.line}; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: ${e.ink2}; white-space: nowrap; }
.cat2:active { background: ${e.pineSoft}; }
/* griglia a riquadri */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 20px 0; }
.tl { position: relative; overflow: hidden; min-height: 112px; border-radius: 20px; background: ${e.card}; padding: 14px; border: 0; text-align: left; cursor: pointer; color: ${e.ink}; font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column; }
.tl:active { filter: brightness(1.12); }
.tl small { font-size: 12.5px; color: ${e.stone}; font-weight: 600; }
.tl .big { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: -2px; line-height: 1; margin-top: auto; padding-top: 10px; }
.tl .sub { font-size: 12.5px; color: ${e.stone}; margin-top: 4px; }
.tl.ida { background: linear-gradient(150deg, #23493F, #16332D); }
.tl.ida .big { color: ${e.ochreLight}; }
.tl.ida small, .tl.ida .sub { color: rgba(246,242,234,.75); }
.tl.map { grid-row: span 2; padding: 0; min-height: 234px; }
.tl.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl.map .lbl { position: absolute; left: 14px; right: 14px; bottom: 14px; }
.tl.map .lbl b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.6px; }
.tl.next { grid-column: span 2; flex-direction: row; align-items: center; gap: 14px; min-height: 0; background: ${e.ochreLight}; color: #1C1408; }

.tl.next div { flex: 1; font-size: 15px; font-weight: 700; min-width: 0; }
.tl.next div small { display: block; font-weight: 600; color: rgba(28,20,8,.75); }
.ticker { display: flex; align-items: center; gap: 8px; margin: 16px 20px 0; font-size: 13px; color: ${e.ink2}; min-height: 18px; white-space: nowrap; overflow: hidden; }
.ticker > span:last-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.scorri { scrollbar-width: none; } .scorri::-webkit-scrollbar { display: none; }
.ticker-tag { white-space: nowrap; font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 400; letter-spacing: 1px; color: ${e.stone}; border: 1px solid ${e.faint}; border-radius: 5px; padding: 1px 5px; flex-shrink: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 20px 10px; }
.sec-h h2 { font-family: 'Hanken Grotesk', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -.5px; color: ${e.ink}; margin: 0; }
.link { background: none; border: 0; color: ${e.ochreLight}; font-weight: 700; font-size: 14px; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.campo input:focus-visible { outline: none !important; }
/* persone come riquadri */
.wlist { display: flex; flex-direction: column; gap: 10px; margin: 0 20px; }
.wcard { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; width: 100%; text-align: left; background: ${e.card}; border: 0; border-radius: 20px; padding: 14px; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; color: ${e.ink}; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.wcard:active { filter: brightness(1.12); }
.wcard.solo { grid-template-columns: minmax(0, 1fr) auto; }
.wcard-b { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wcard-n { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; color: ${e.ink}; line-height: 1.25; }
.wcard-av { width: 7px; height: 7px; border-radius: 50%; background: ${e.ok}; flex-shrink: 0; }
.wcard-bio { font-size: 13px; color: ${e.stone}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wcard-q { font-size: 13.5px; line-height: 1.45; color: ${e.ink2}; margin-top: 6px; }
.wcard-q span { color: ${e.stone}; }
.wcard-tags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; }

.wcard-tags > span { font-size: 12px; font-weight: 600; color: ${e.ink2}; background: ${e.pineSoft}; border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
.wcard-tags b { color: ${e.ink}; }
.wcard-tags .no { color: ${e.ember}; background: ${e.emberSoft}; }
.tag { font-size: 12px; font-weight: 600; color: ${e.ink2}; white-space: nowrap; }
.wcard-r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; line-height: 1; text-align: right; }
.ida-n { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: -1px; color: ${e.ochreLight}; }
.ida-n.top { color: ${e.ochreLight}; }
.ida-n.nuovo { font-size: 11px; letter-spacing: 1px; color: ${e.ochreLight}; border: 1.5px solid ${e.ochre}; border-radius: 6px; padding: 3px 6px; }
.ida-lab { font-size: 11px; font-weight: 600; color: ${e.stone}; margin-top: 3px; }
.ida-card { display: block; width: calc(100% - 40px); margin: 22px 20px 0; padding: 18px; border: 0; border-radius: 20px; text-align: left; cursor: pointer; background: linear-gradient(150deg, #23493F, #16332D); color: rgba(246,242,234,.8); font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; line-height: 1.5; }
.ida-t { font-size: 16px; font-weight: 800; color: ${e.cream}; }
.ida-l { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 700; color: ${e.ochreLight}; }
.tiles { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 10px 20px 0; padding: 0; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 92px; padding: 14px 12px; background: ${e.card}; border: 0; border-radius: 18px; cursor: pointer; text-align: left; font-family: 'Hanken Grotesk', sans-serif; color: ${e.ink}; }
.tile:active { filter: brightness(1.12); }
.tile svg { margin-bottom: auto; color: ${e.ochreLight}; }
.tile-l { font-size: 14px; font-weight: 700; margin-top: 10px; }
.tile-s { font-size: 12.5px; color: ${e.stone}; line-height: 1.3; }

.head { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 14px 20px 12px; background: ${e.paper}; }
.head-root { padding-top: 22px; }
.head-root .head-t { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.head-back { width: 44px; height: 44px; border-radius: 14px; border: 0; background: ${e.card}; color: ${e.ink}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.head-t { font-family: 'Hanken Grotesk', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -.5px; color: ${e.ink}; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* barra in basso: icone su sfumatura, la voce attiva in un riquadro */
.dock-wrap { background: ${e.paper}; padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; border-top: 1px solid ${e.line}; }
.dock { display: flex; align-items: center; justify-content: space-around; gap: 4px; }
.dock-i, .dock-plus { flex: 1; max-width: 72px; min-height: 52px; border: 0; border-radius: 16px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; color: ${e.stone}; }
.dock-i span, .dock-plus > span:last-child { font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.dock-i.on { color: ${e.ink}; background: ${e.card}; }
.dock-plus { color: ${e.ochreLight}; }
.dock-plus-i { width: 34px; height: 26px; border-radius: 9px; background: ${e.ochreLight}; color: #1C1408; display: flex; align-items: center; justify-content: center; }
.next-card { display: flex; align-items: center; gap: 12px; width: calc(100% - 40px); margin: 14px 20px 0; padding: 14px 16px; border-radius: 18px; border: 0; background: ${e.ochreLight}; text-align: left; cursor: pointer; font-family: inherit; color: #1C1408; }
.next-t { display: block; font-size: 12px; font-weight: 700; color: rgba(28,20,8,.75); text-transform: uppercase; letter-spacing: .5px; }
.next-s { display: block; font-size: 15px; font-weight: 700; color: #1C1408; margin-top: 2px; }
.dock-i:focus-visible, .dock-plus:focus-visible, .wcard:focus-visible, .cat2:focus-visible, .tile:focus-visible, .head-back:focus-visible, .ida-card:focus-visible, .tl:focus-visible, .lrow:focus-visible, .next-card:focus-visible { outline: 2.5px solid ${e.ochreLight}; outline-offset: 2px; }

/* cerca: righe-riquadro con colonne ordinabili */
.ledger-h { display: grid; grid-template-columns: minmax(0, 1fr) 52px 48px 48px; gap: 8px; padding: 0 34px; position: sticky; top: 0; background: ${e.paper}; z-index: 2; }
.ledger-h > span, .ledger-h button { font-size: 12px; font-weight: 600; color: ${e.stone}; min-height: 40px; display: flex; align-items: center; }
.ledger-h button { justify-content: flex-end; background: none; border: 0; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.ledger-h button[aria-pressed="true"] { color: ${e.ochreLight}; font-weight: 800; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 52px 48px 48px; gap: 8px; align-items: center; width: calc(100% - 40px); margin: 0 20px 8px; min-height: 66px; padding: 10px 14px; background: ${e.card}; border: 0; border-radius: 18px; text-align: left; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; color: ${e.ink}; }
.lrow:active { filter: brightness(1.12); }
.lrow > span:not(:first-child) { text-align: right; font-family: 'Space Mono', monospace; font-size: 14px; }
.lrow-n { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 700; }
.lrow-s { display: block; font-size: 12.5px; color: ${e.stone}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .lrow-ida { font-weight: 700; font-size: 18px !important; color: ${e.ochreLight}; }
.lrow.off { opacity: .6; }
.fchip { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid ${e.line}; background: ${e.card}; font-size: 14px; font-weight: 600; color: ${e.ink2}; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; white-space: nowrap; }
.fchip[aria-pressed="true"] { background: ${e.ochreLight}; border-color: ${e.ochreLight}; color: #1C1408; }

/* profilo di chi lavora */
.pro-k { font-size: 13px; font-weight: 700; color: ${e.ochreLight}; }
.pro-h { font-family: 'Hanken Grotesk', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1.3px; line-height: 1.05; color: ${e.ink}; margin: 6px 0 0; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 14px; color: ${e.ink2}; }
.facts > span { display: inline-flex; align-items: center; gap: 6px; }
.slot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: 18px; background: ${e.ochreLight}; font-size: 14px; font-weight: 600; color: rgba(28,20,8,.8); }
.slot b { font-family: 'Space Mono', monospace; font-size: 15px; color: #1C1408; white-space: nowrap; }
.slot.no { background: ${e.card}; color: ${e.ink2}; } .slot.no b { color: ${e.ochreLight}; }
.ida-block { margin-top: 12px; border-radius: 20px; padding: 18px; background: linear-gradient(150deg, #23493F, #16332D); }
.ida-hero { display: flex; align-items: flex-end; gap: 14px; }
.ida-hero > b { font-family: 'Space Mono', monospace; font-size: 56px; line-height: .85; letter-spacing: -4px; color: ${e.ochreLight}; }
.ida-hero > b.nuovo { font-size: 18px; letter-spacing: 1px; border: 2px solid ${e.ochreLight}; border-radius: 8px; padding: 6px 8px; line-height: 1; }
.ida-hero strong { display: block; font-size: 17px; font-weight: 800; color: ${e.cream}; }
.ida-hero small { font-size: 13.5px; color: rgba(246,242,234,.78); }
.voci { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: rgba(246,242,234,.85); }
.voci li { background: rgba(246,242,234,.08); border-radius: 8px; padding: 4px 8px; }
.voci b { font-family: 'Space Mono', monospace; font-weight: 700; color: ${e.cream}; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.trio > div { padding: 14px 6px; text-align: center; background: ${e.card}; border-radius: 16px; }
.trio b { display: block; font-family: 'Space Mono', monospace; font-size: 17px; color: ${e.ink}; white-space: nowrap; }
.trio small { font-size: 12px; color: ${e.stone}; }
.rev { background: ${e.card}; border-radius: 18px; padding: 16px !important; margin-top: 10px; border: 0 !important; }
.rev q { display: block; font-size: 15.5px; line-height: 1.5; color: ${e.ink}; quotes: "\u201C" "\u201D"; }
.rev-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; font-size: 12.5px; color: ${e.stone}; }
.rev-f b { font-family: 'Space Mono', monospace; font-size: 14px; color: ${e.ochreLight}; margin-right: 6px; }

/* bacheca */
.seg { display: flex; gap: 8px; margin: 0 20px; }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 12px; background: ${e.card}; border: 1px solid ${e.line}; font-size: 14px; font-weight: 600; color: ${e.ink2}; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.seg button[aria-pressed="true"] { background: ${e.ochreLight}; border-color: ${e.ochreLight}; color: #1C1408; }
.post { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; padding: 16px; margin-bottom: 10px; background: ${e.card}; border-radius: 20px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; position: relative; }
.post-t { position: absolute; top: 16px; right: 16px; font-family: 'Space Mono', monospace; font-size: 11.5px; color: ${e.stone}; }
.post-k { font-size: 12px; font-weight: 700; color: ${e.ochreLight}; padding-right: 70px; }
.post-k.job { color: ${e.accent}; }
.post-x { font-size: 15.5px; line-height: 1.45; color: ${e.ink}; margin-top: 6px; }
.post-by { font-size: 12.5px; color: ${e.stone}; margin-top: 6px; }
.post-a { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.post-a .rispondi { min-height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: ${e.ochreLight}; font-size: 14px; font-weight: 700; color: #1C1408; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.post-a .n { font-size: 12.5px; font-weight: 600; color: ${e.ink2}; }
.post-a .segn { margin-left: auto; font-size: 12.5px; color: ${e.stone}; }
.post.mine { box-shadow: inset 0 0 0 1.5px ${e.ochre}; }

.onb-visual { display: flex; justify-content: center; align-items: center; min-height: 230px; margin: 18px 0 8px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.onb-glyph { width: 150px; height: 150px; border-radius: 44px; background: rgba(169,118,43,.12); border: 1px solid rgba(169,118,43,.28); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 80px -10px rgba(169,118,43,.35); }
.onb-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: ${e.ochreLight}; margin-bottom: 10px; }
.onb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.onb-chips span { font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 10px; border: 1px solid rgba(246,242,234,.16); color: rgba(246,242,234,.85); }
.onb-dots { display: flex; gap: 7px; flex: 1; }
.onb-dots button { height: 8px; width: 8px; border-radius: 4px; border: 0; padding: 0; background: rgba(246,242,234,.25); cursor: pointer; transition: width .3s, background .3s; }
.onb-dots button.on { width: 26px; background: ${e.ochre}; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes glow { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes mq { to { transform: translateX(-50%); } }
@keyframes barin { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .seal-draw { stroke-dashoffset: 0 !important; } .mq-track { flex-wrap: wrap; width: auto; } }
