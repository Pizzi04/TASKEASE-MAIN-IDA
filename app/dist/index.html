.dot:hover { filter: brightness(1.1); transform: translate(-50%,-50%) scale(1.2); }
.tap:active { transform: scale(.92); opacity: .7; }

/* ---------- Dentro l'app \u2014 "notte e ocra": riquadri arrotondati, numeri grandi, accenti ocra ---------- */
.home { flex: 1; min-height: 0; overflow-y: auto; background: transparent; }

.home-search, .home-cta { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 16px; font-family: 'Hanken Grotesk', sans-serif; font-size: 16px; cursor: pointer; text-align: left; }

/* griglia a riquadri */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 20px 0; }
.tl { position: relative; overflow: hidden; min-height: 112px; border-radius: 20px; background: ${a.card}; padding: 14px; border: 0; text-align: left; cursor: pointer; color: ${a.ink}; font-family: 'Hanken Grotesk', sans-serif; display: flex; flex-direction: column; }

.ticker { display: flex; align-items: center; gap: 8px; margin: 16px 20px 0; font-size: 13px; color: ${a.ink2}; min-height: 18px; white-space: nowrap; overflow: hidden; }

.ticker-tag { white-space: nowrap; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 1px; color: ${a.stone}; border: 1px solid ${a.faint}; border-radius: 5px; padding: 1px 5px; flex-shrink: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 20px 10px; }

.link { background: none; border: 0; color: ${a.ochreLight}; font-weight: 700; font-size: 14px; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.campo input:focus-visible { outline: none !important; }
/* persone come riquadri */
.wlist { display: flex; flex-direction: column; gap: 10px; margin: 0 20px; }

.wcard-n { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; color: ${a.ink}; line-height: 1.25; }

.tag { font-size: 12px; font-weight: 600; color: ${a.ink2}; white-space: nowrap; }

/* barra in basso: icone su sfumatura, la voce attiva in un riquadro */
.dock-wrap { background: ${a.paperVetro}; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; border-top: 1px solid ${a.line}; }

.dock-i:focus-visible, .dock-plus:focus-visible, .wcard:focus-visible, .cat2:focus-visible, .tile:focus-visible, .head-back:focus-visible, .ida-card:focus-visible, .tl:focus-visible, .lrow:focus-visible, .next-card:focus-visible { outline: 2.5px solid ${a.ochreLight}; outline-offset: 2px; }

.fchip[aria-pressed="true"] { background: ${a.ochreLight}; border-color: ${a.ochreLight}; color: #1C1408; }

/* profilo di chi lavora */

.ida-hero small { font-size: 13.5px; color: rgba(246,242,234,.78); }
.voci { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: rgba(246,242,234,.85); }
.voci li { background: rgba(246,242,234,.08); border-radius: 8px; padding: 4px 8px; }
.voci b { font-family: 'Space Mono', monospace; font-weight: 700; color: ${a.cream}; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.trio > div { padding: 14px 6px; text-align: center; background: ${a.card}; border-radius: 16px; }
.trio b { display: block; font-family: 'Space Mono', monospace; font-size: 17px; color: ${a.ink}; white-space: nowrap; }
.trio small { font-size: 12px; color: ${a.stone}; }
.rev { background: ${a.card}; border-radius: 18px; padding: 16px !important; margin-top: 10px; border: 0 !important; }
.rev q { display: block; font-size: 15.5px; line-height: 1.5; color: ${a.ink}; quotes: "\u201C" "\u201D"; }
.rev-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; font-size: 12.5px; color: ${a.stone}; }
.rev-f b { font-family: 'Space Mono', monospace; font-size: 14px; color: ${a.ochreLight}; margin-right: 6px; }

/* bacheca */
.seg { display: flex; gap: 8px; margin: 0 20px; }
.seg button { min-height: 44px; padding: 0 14px; border-radius: 12px; background: ${a.card}; border: 1px solid ${a.line}; font-size: 14px; font-weight: 600; color: ${a.ink2}; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.seg button[aria-pressed="true"] { background: ${a.ochreLight}; border-color: ${a.ochreLight}; color: #1C1408; }
.post { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; padding: 16px; margin-bottom: 10px; background: ${a.card}; border-radius: 20px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; position: relative; }
.post-t { position: absolute; top: 16px; right: 16px; font-family: 'Space Mono', monospace; font-size: 12px; color: ${a.stone}; }
.post-k { font-size: 12px; font-weight: 700; color: ${a.ochreLight}; padding-right: 70px; }
.post-k.job { color: ${a.accent}; }
.post-x { font-size: 15.5px; line-height: 1.45; color: ${a.ink}; margin-top: 6px; }
.post-by { font-size: 12.5px; color: ${a.stone}; margin-top: 6px; }
.post-a { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.post-a .rispondi { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: ${a.ochreLight}; font-size: 14px; font-weight: 700; color: #1C1408; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; }
.post-a .n { font-size: 12.5px; font-weight: 600; color: ${a.ink2}; }
.post-a .segn { margin-left: auto; font-size: 12.5px; color: ${a.stone}; }
.post.mine { box-shadow: inset 0 0 0 1.5px ${a.ochre}; }

/* ---------- movimento: leggero, una volta sola o lento, spento con "riduci movimento" ---------- */
.bento .tl { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.bento .tl:nth-child(2) { animation-delay: .06s; } .bento .tl:nth-child(3) { animation-delay: .12s; } .bento .tl:nth-child(4) { animation-delay: .18s; } .bento .tl:nth-child(5) { animation-delay: .24s; }
.tiles li { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; } .tiles li:nth-child(2) { animation-delay: .06s; } .tiles li:nth-child(3) { animation-delay: .12s; }
.lrow { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.voci li { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.trio > div, .rev { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.trio > div:nth-child(2) { animation-delay: .05s; } .trio > div:nth-child(3) { animation-delay: .1s; }
.ida-block { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
/* riflesso che passa sul prossimo appuntamento */
.tl.next::after, .slot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-100%); animation: riflesso 5s ease-in-out 1.2s infinite; pointer-events: none; }
.slot { position: relative; overflow: hidden; }
@keyframes riflesso { 0% { transform: translateX(-100%); } 22%, 100% { transform: translateX(100%); } }
/* titolo con l'ocra che scorre */
.home-h em { background-size: 200% 100%; background-image: linear-gradient(90deg, ${a.ochreLight}, #F6DDA9, ${a.ochreLight}); animation: scorre 6s ease-in-out infinite; }
@keyframes scorre { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
/* chi \xE8 disponibile "respira" */
.wcard-av, .lrow-n .wcard-av { animation: respira 2.4s ease-in-out infinite; }
@keyframes respira { 0%, 100% { box-shadow: 0 0 0 0 rgba(79,209,160,.55); } 60% { box-shadow: 0 0 0 6px rgba(79,209,160,0); } }
/* mappa */
.tl.map .giro { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
.tl.map .onda { transform-box: fill-box; transform-origin: center; animation: onda 2.6s ease-out infinite; opacity: 0; }
.tl.map .pop { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.2,1.5,.5,1) both; }
@keyframes onda { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
/* barra in basso: piccolo rimbalzo della voce attiva */
.dock-i { transition: background .25s, color .25s; }
.dock-i.on svg { animation: pop .4s cubic-bezier(.2,1.6,.5,1); }
.dock-plus:active .dock-plus-i { transform: scale(.9); }
.dock-plus-i { transition: transform .15s; }
/* pulsante premuto */
.tl, .wcard, .lrow, .tile, .post-a .rispondi, .fchip, .cat2, .seg button { transition: transform .15s, filter .15s, background .2s; }
.tl:active, .wcard:active, .lrow:active, .tile:active { transform: scale(.98); }

/* ---------- sfondo dell'app: bagliori verdi e ocra del tema, fermi mentre il contenuto scorre ---------- */
.sfondo { isolation: isolate; }
.sfondo::before, .sfondo::after { content: ""; position: absolute; inset: -25%; z-index: 0; pointer-events: none; }
/* colori saturi ma scuri: si vedono bene e il testo sopra resta leggibile (\u2265 4,5:1) */
.sfondo::before {
  background:
    radial-gradient(40% 30% at 15% 10%, rgba(10,140,100,.55), transparent 72%),
    radial-gradient(38% 30% at 95% 40%, rgba(200,135,40,.42), transparent 72%),
    radial-gradient(40% 28% at 20% 90%, rgba(200,135,40,.36), transparent 72%);
  animation: bagliore-in 1.4s ease both, deriva 30s ease-in-out 1.4s infinite alternate; }
.sfondo::after {
  background:
    radial-gradient(34% 26% at 85% 8%, rgba(220,170,60,.30), transparent 72%),
    radial-gradient(36% 28% at 10% 55%, rgba(20,150,110,.38), transparent 72%),
    radial-gradient(36% 26% at 90% 92%, rgba(10,140,100,.42), transparent 72%);
  animation: bagliore-in 2s ease both, deriva-2 38s ease-in-out 2s infinite alternate; }
@keyframes deriva-2 { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(5%, -4%) rotate(-7deg); } }
@keyframes bagliore-in { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
@keyframes deriva { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-4%, 3%) rotate(6deg); } }

/* ---------- ingresso: bagliori verdi e ocra che si muovono piano dietro il contenuto ---------- */
.ent { isolation: isolate; }
.ent::before, .ent::after { content: ""; position: absolute; inset: -30%; z-index: 0; pointer-events: none; }
.ent::before {
  background:
    radial-gradient(30% 22% at 22% 20%, rgba(79,209,160,.30), transparent 70%),
    radial-gradient(34% 26% at 80% 42%, rgba(224,182,118,.48), transparent 70%),
    radial-gradient(30% 22% at 30% 78%, rgba(224,182,118,.32), transparent 70%);
  animation: bagliore-in 1.6s ease both, giro-a 28s ease-in-out infinite alternate; }
.ent::after {
  background:
    radial-gradient(26% 20% at 72% 16%, rgba(240,207,149,.32), transparent 70%),
    radial-gradient(32% 24% at 18% 55%, rgba(36,120,104,.45), transparent 70%),
    radial-gradient(28% 20% at 82% 84%, rgba(79,209,160,.18), transparent 70%);
  animation: bagliore-in 2.2s ease both, giro-b 34s ease-in-out infinite alternate; }
@keyframes giro-a { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(6%, -4%) rotate(10deg); } }
@keyframes giro-b { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-5%, 5%) rotate(-8deg); } }
.ent > * { position: relative; z-index: 1; }
.ent > .ent-bar { position: absolute; z-index: 2; }

.onb-visual { display: flex; justify-content: center; align-items: center; min-height: 230px; margin: 18px 0 8px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.onb-glyph { width: 150px; height: 150px; border-radius: 44px; background: rgba(169,118,43,.12); border: 1px solid rgba(169,118,43,.28); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 80px -10px rgba(169,118,43,.35); }
.onb-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: ${a.ochreLight}; margin-bottom: 10px; }
.onb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.onb-chips span { font-size: 12.5px; font-weight: 600; padding: 6px 11px; border-radius: 10px; border: 1px solid rgba(246,242,234,.16); color: rgba(246,242,234,.85); }
.onb-dots { display: flex; gap: 7px; flex: 1; }
.onb-dots button { height: 8px; width: 8px; border-radius: 4px; border: 0; padding: 0; background: rgba(246,242,234,.25); cursor: pointer; transition: width .3s, background .3s; }
.onb-dots button.on { width: 26px; background: ${a.ochre}; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes glow { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes mq { to { transform: translateX(-50%); } }
@keyframes barin { from { transform: translateY(100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .seal-draw { stroke-dashoffset: 0 !important; } .mq-track { flex-wrap: wrap; width: auto; } }

Informazioni legali",s:[["Chi gestisce TaskEase",`${Ve.nome} \xB7 P.IVA ${Ve.piva} \xB7 Sede: ${Ve.indirizzo}, ${Ve.citta}.`],["Contatti",`Email: ${Ve.email} \xB7 Telefono/WhatsApp: ${Ve.telefono}. \xC8 anche il punto di contatto per utenti e autorit\xE0 previsto dal Regolamento UE sui servizi digitali (DSA). Rispondiamo in italiano.`],["Cosa siamo","Una piattaforma che mette in contatto chi cerca aiuto con chi lavora nella zona di Forl\xEC-Cesena. Non siamo parte dell'accordo tra cliente e chi lavora e non incassiamo il prezzo del lavoro."],["Versione dei documenti",Oo+". Le modifiche ai Termini vengono annunciate almeno 15 giorni prima; quelle alle regole dell'IDA 30 giorni prima."]]},termini:{t:"Termini d'uso",s:[["Cosa fa TaskEase","Ti aiuta a trovare chi pu\xF2 fare un lavoro e a prenotarlo. L'accordo su lavoro, tempi e prezzo \xE8 tra te e chi lavora: TaskEase non lo esegue, non lo dirige e non \xE8 il datore di lavoro di nessuno."],["Chi pu\xF2 usarla","Persone maggiorenni che danno dati veri. Un profilo per persona. Sei responsabile di quello che scrivi."],["Professionisti e privati","Ogni profilo dichiara se lavora con Partita IVA o da privato in prestazione occasionale, e lo mostriamo. Con un privato non si applicano i diritti dei consumatori previsti dal diritto UE (per esempio recesso e garanzie del Codice del Consumo)."],["Impianti","Lavori su impianti elettrici, gas, idrico-sanitari e di riscaldamento li possono fare solo imprese abilitate (DM 37/2008). Chi sceglie queste categorie lo dichiara e ne risponde."],["Prezzi e pagamenti","La tariffa \xE8 decisa da chi lavora e mostrata prima della prenotazione. Paghi direttamente a fine lavoro, come vi accordate. TaskEase non incassa n\xE9 trattiene niente sul lavoro. L'abbonamento Pro per chi lavora \xE8 facoltativo e non cambia l'ordine dei risultati n\xE9 l'IDA."],["Giudizi e IDA","Pu\xF2 giudicare solo chi ha prenotato tramite TaskEase. Le regole di calcolo sono pubbliche nella pagina \u201CCome verifichiamo i giudizi\u201D. Chi riceve un giudizio potr\xE0 rispondere una volta (funzione attiva al lancio)."],["Contenuti vietati e segnalazioni","Vietati contenuti illegali, offensivi, falsi o con dati personali di altri. Chiunque pu\xF2 segnalarli con il tasto \u201CSegnala\u201D. Decidiamo in modo motivato e lo comunichiamo per SMS o email a chi ha segnalato e a chi ha pubblicato. Entrambi possono contestare la decisione, gratis, rispondendo a quel messaggio entro 6 mesi: la riesamina una persona."],["Sospensione e chiusura","Possiamo sospendere un profilo per violazioni gravi o ripetute, spiegando il motivo. Puoi cancellare il tuo profilo quando vuoi da Profilo."],["Responsabilit\xE0","Chi esegue il lavoro ne risponde. TaskEase risponde del proprio servizio di messa in contatto, nei limiti di legge."],["Legge e foro","Legge italiana. Per i consumatori \xE8 competente il giudice del luogo in cui risiedono."]]},privacy:{t:"Informativa privacy",s:[["Titolare del trattamento",`${Ve.nome}, ${Ve.indirizzo}, ${Ve.citta} \xB7 ${Ve.email}.`],["Quali dati","Chi cerca aiuto: nome, cellulare, zona; l'indirizzo solo quando prenoti. Chi lavora: in pi\xF9 nome e cognome, foto, competenze, tariffa, zone, data di nascita, residenza, codice fiscale, eventuale Partita IVA e le dichiarazioni su abilitazione e assicurazione. Per tutti: prenotazioni, giudizi, messaggi, annunci in bacheca (con eventuale foto), preferiti, persone bloccate, segnalazioni (con nome ed email di chi segnala) e la data in cui hai accettato i Termini."],["Perch\xE9 e su quale base","Per far funzionare il servizio che chiedi (contratto). Per obblighi di legge: comunicazione fiscale delle piattaforme (DAC7) e gestione delle segnalazioni previste dal Regolamento UE sui servizi digitali. Per la sicurezza degli utenti, compresa la verifica dell'identit\xE0 di chi lavora (legittimo interesse). Niente pubblicit\xE0 e niente vendita di dati."],["Chi li vede","Pubblici, visibili a chiunque usi l'app: il profilo di chi lavora (nome e cognome, foto, competenze, tariffa, zone, IDA, se \xE8 privato o con P.IVA), i giudizi con nome e iniziale di chi li ha scritti, gli annunci in bacheca con nome e zona. Riservati: cellulare e indirizzo, solo a chi accetta il lavoro; dati fiscali, solo a noi e, quando dovuto, all'Agenzia delle Entrate. Fornitori tecnici (hosting e invio SMS) li trattano per nostro conto, nell'Unione europea."],["Per quanto tempo","Finch\xE9 il profilo \xE8 attivo. Messaggi e segnalazioni: 12 mesi dalla chiusura. Se un profilo resta inattivo 24 mesi ti avvisiamo e poi lo cancelliamo. Dopo la cancellazione togliamo i dati entro 30 giorni, tranne quelli che la legge ci obbliga a conservare (dati fiscali); i giudizi che hai lasciato restano senza il tuo nome."],["Documenti d'identit\xE0","La verifica la facciamo guardando il documento di persona o in videochiamata. Non conserviamo copie: salviamo solo che la verifica \xE8 avvenuta e quando."],["I tuoi diritti","Accesso, correzione, cancellazione, portabilit\xE0 (\u201CScarica i miei dati\u201D in Profilo), opposizione e limitazione. Puoi fare reclamo al Garante per la protezione dei dati personali."],["Cookie e caratteri","Solo cookie tecnici necessari al funzionamento. Nessun cookie di profilazione o di statistica. In questa anteprima i caratteri tipografici arrivano da Google Fonts; nell'app vera li ospitiamo sui nostri server."]]},ranking:{t:"Come ordiniamo i risultati",s:[["L'ordine di partenza","Dalla persona pi\xF9 vicina a te. La distanza si calcola dalla tua zona, non dal tuo indirizzo. Nessuno paga per comparire prima e l'abbonamento Pro non cambia l'ordine."],["In home","Vedi le tre persone disponibili pi\xF9 vicine. Chi ha spento \u201CDisponibile\u201D lo trovi comunque in Cerca."],["Gli ordinamenti che scegli tu","Puoi ordinare per prezzo o per IDA pi\xF9 alto. Ordinando per IDA, chi \xE8 nuovo e non ha ancora un IDA va in fondo, dopo gli altri. Le categorie filtrano per competenze e descrizione dichiarate."],["Cosa non usiamo","Non premiamo chi accetta pi\xF9 lavori o risponde pi\xF9 spesso, e non nascondiamo chi rifiuta."]]},giudizi:{t:"Come verifichiamo i giudizi",s:[["Chi pu\xF2 giudicare","Solo chi ha prenotato quel lavoro tramite TaskEase: un giudizio per prenotazione."],["Come si calcola","Cinque domande da 1 a 5: puntualit\xE0 20%, qualit\xE0 30%, parola mantenuta 20%, pulizia 15%, comunicazione 15%. Ogni giudizio vale da 20 a 100. L'IDA compare dopo "+Re+" lavori: gli ultimi 12 mesi contano per intero, da 12 a 24 mesi a met\xE0, oltre non contano."],["Cosa non facciamo","Non paghiamo giudizi, non li scriviamo noi e non togliamo quelli negativi. Rimuoviamo solo testi illegali, offensivi o con dati personali, spiegando il motivo."],["Diritto di replica","Al lancio chi riceve un giudizio potr\xE0 rispondere una volta, sotto al giudizio. Nell'anteprima la risposta non \xE8 ancora attiva."]]},sicurezza:{t:"Consigli di sicurezza",s:[["Prima del lavoro","Concorda per iscritto in chat cosa va fatto, la tariffa e le ore stimate. Diffida di chi chiede soldi in anticipo."],["Durante","Se puoi, non restare solo in casa con persone che non conosci la prima volta. Per i lavori su impianti chiedi la dichiarazione di conformit\xE0."],["Dopo","Paga solo le ore reali, chiedi la ricevuta o la fattura se dovuta, e lascia il giudizio: aiuta chi verr\xE0 dopo."],["Se qualcosa va storto","Usa \u201CSegnala un problema\u201D: leggiamo ogni segnalazione. In caso di pericolo chiama il 112."]]}};function jh({nav:e,doc:t="info"}){let n=Sa[t]||Sa.info;return(0,i.jsxs)("div",{style:{flex:1,minHeight:0,background:"transparent",overflow:"auto"},children:[(0,i.jsx)(ze,{nav:e,to:"account",title:n.t}),(0,i.jsxs)("div",{style:{padding:"4px 22px 28px"},children:[(0,i.jsxs)("div",{className:"esempio-top",style:{marginBottom:16},children:[(0,i.jsx)("span",{className:"ticker-tag",children:"BOZZA"}),(0,i.jsxs)("span",{children:[Oo,". Testo per l'anteprima, da far revisionare a un legale prima del lancio."
